<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Barter Market · WTH Is Money?</title>
<meta name="description" content="Trade alien goods at a village market and watch money appear on its own.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="lesson.css">
<link rel="stylesheet" href="phone.css">
</head>
<body>

<header class="topbar">
  <a class="brand pixel" href="../../index.html">WTH IS <span class="gold">MONEY?</span></a>
  <div class="daybox pixel"><span id="day-label">DAY 1</span><span id="phase-label" class="muted"></span></div>
  <button class="mute" id="mute" title="Music and sound on/off" aria-label="Music and sound on/off">🔊</button>
  <div class="family" id="family"></div>
</header>
<div class="status" id="status" role="button"></div>

<main class="game">
  <section class="world">
    <div class="world-frame" id="world-frame">
      <canvas id="world" class="px" width="384" height="224"></canvas>
      <div class="overlay" id="overlay"></div>
      <div class="route-banner" id="route-banner" hidden></div>
      <div class="toast" id="toast" hidden></div>
    </div>
    <!-- the pack strip and the day's buttons: always on screen -->
    <div class="dock" id="dock">
      <div class="strip" id="strip"></div>
      <div class="actionbar">
        <span class="hint muted" id="hint">Walk with <b>WASD</b>/arrows or click. <b>E</b> next to a stall to talk, <b>H</b> to go home.</span>
        <button class="btn ghost" id="btn-help" title="Find a way to get what home needs">🧭 HELP</button>
        <button class="btn home" id="btn-home">🏠 GO HOME ▶</button>
      </div>
    </div>
    <div class="ticker" id="ticker"></div>
  </section>

  <aside class="side" id="side">
    <nav class="tabs">
      <button class="tab on" data-tab="pack">PACK</button>
      <button class="tab" data-tab="notes">NOTEBOOK</button>
      <button class="tab" data-tab="village" id="tab-village" hidden>VILLAGE</button>
    </nav>
    <div class="tabpane" id="pane-pack"></div>
    <div class="tabpane" id="pane-notes" hidden></div>
    <div class="tabpane" id="pane-village" hidden></div>
  </aside>
</main>

<!-- trade table: their stall on top, your pack at the bottom -->
<div class="modal" id="dialog" hidden>
  <div class="card trade">
    <button class="close" data-close>✕</button>
    <div class="trade-head">
      <canvas class="portrait px" id="portrait" width="20" height="24"></canvas>
      <div>
        <h2 id="d-name"></h2>
        <p class="say" id="d-say"></p>
        <p class="looking" id="d-looking"></p>
      </div>
    </div>
    <div class="table">
      <div class="table-label pixel" id="d-their-label"></div>
      <div class="cards" id="d-theirs"></div>
      <div class="deal" id="d-deal"></div>
      <div class="cards" id="d-mine"></div>
      <div class="table-label pixel mine-label">YOUR PACK</div>
    </div>
    <div class="takes" id="d-takes"></div>
  </div>
</div>

<!-- story / insight cards -->
<div class="modal" id="story" hidden>
  <div class="card story">
    <div id="story-body"></div>
    <div class="story-actions"><button class="btn ghost" id="story-alt" hidden></button><button class="btn" id="story-ok">OK</button></div>
  </div>
</div>

<script src="../../assets/js/chip.js"></script>
<!-- evening at home: the family, a picture, a few lines, NEXT DAY -->
<div class="modal" id="evening" hidden>
  <div class="card eve">
    <div class="eve-head pixel" id="eve-head"></div>
    <div class="eve-pic"><canvas id="eve-canvas" class="px" width="176" height="132"></canvas></div>
    <div class="eve-kin" id="eve-kin"></div>
    <p class="eve-q" id="eve-q"></p>
    <div class="eve-lines" id="eve-lines"></div>
    <p class="eve-facts" id="eve-facts"></p>
    <div class="eve-actions" id="eve-actions"></div>
  </div>
</div>

<!-- the first screen: a short welcome, the one-minute movie, or straight to the market -->
<div class="modal" id="intro" hidden>
  <div class="card intro-card">
    <div id="intro-body"></div>
    <div class="movie-wrap" id="movie-wrap" hidden>
      <video id="movie" class="movie" playsinline webkit-playsinline preload="none" poster="../../video/ep02/barter/out/poster.jpg">
        <track kind="captions" src="../../video/ep02/barter/out/captions.vtt" srclang="en" label="English" default>
      </video>
      <p class="movie-cap" id="movie-cap"></p>
    </div>
    <div class="intro-actions">
      <button class="btn" id="btn-watch">▶ WATCH: HOW THE MARKET WORKS (80 s)</button>
      <button class="btn ghost" id="btn-skip">SKIP, LET ME PLAY</button>
    </div>
  </div>
</div>

<!-- day one: one pointer at a time -->
<div class="pointer" id="pointer" hidden><div class="pbubble" id="pointer-text"></div><div class="arrow">▼</div></div>

<script src="sim.js"></script>
<script src="art.js"></script>
<script src="evening.js"></script>
<script src="game.js"></script>
</body>
</html>
